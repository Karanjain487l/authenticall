name: authenticall
description: "AuthentiCall AI - Real-time deepfake voice detection for secure calls (Flutter + Agora)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (simple, no codegen)
  provider: ^6.1.2

  # Local database (works on Android / iOS / Web)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Permissions (Android / iOS microphone)
  permission_handler: ^11.3.1

  # Live microphone PCM streaming (Android / iOS)
  audio_streamer: ^5.0.0

  # Agora RTC - secure audio calls + raw audio frame access
  agora_rtc_engine: ^6.3.2
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/authenticall_ens_mobile_float32.tflite
    - assets/mobile_model_spec.json
